# Product Gap Finder settings.
# Everything you might want to tweak lives here, so you never need to edit code.
# API keys do NOT go here; they go in .env.

# Which collectors run, and how often.
#   enabled:  true / false
#   schedule: weekly (on weekly_run_day) or daily
# The pipeline itself runs every day at noon (Windows Task Scheduler); each
# collector only does work on the days it's due. A missed weekly run is made
# up on the next day the pipeline runs.
weekly_run_day: monday

collectors:
  kalodata:
    enabled: true
    schedule: weekly
  amazon:
    enabled: true
    schedule: weekly
  reddit:
    enabled: true
    schedule: daily     # free, so daily
  # Enrichment: these look up keywords from the watchlist and from concepts.
  google_trends:
    enabled: true
    schedule: weekly
  tiktok:
    enabled: true
    schedule: weekly
  kalodata_keywords:
    enabled: true
    schedule: weekly

# --- Concept grouping (Claude) ---
# Groups items from every source into product concepts. Runs daily but only
# looks at items it hasn't classified yet, so most days it's quick and cheap.
concepts:
  model: claude-opus-5        # or claude-sonnet-5 / claude-haiku-4-5 to cut cost
  effort: low                 # classification doesn't need deep reasoning
  batch_size: 40              # items per request to Claude
  max_items_per_run: 1500
  max_concepts_in_prompt: 300 # beyond this, only the closest-matching concepts are sent
  max_cost_per_run_usd: 10.00 # stop for the day once this is reached

# Product types to never treat as products (TikTok Shop prohibited or
# restricted items). Fill in from TikTok Shop's list; plain words are fine.
excluded_product_types: []

# --- Metrics (features step) ---
features:
  rising_threshold: 0.10       # a source counts as "rising" at +10% or more
  velocity_cap: 2.0            # growth above +200% counts as +200% (stops one wild number dominating)
  tiktok_max_age_weeks: 4      # use a concept's TikTok checks from up to 4 weeks ago
  google_max_age_weeks: 8      # use a concept's Google check from up to 8 weeks ago
  google_min_interest: 5       # ignore Google growth when interest is below this (0-100 scale; tiny numbers are noise)
  spike_ratio: 2.0             # a recent week at 2x the typical level, without a steady climb, is a spike
  amazon_new_entry_value: 0.5  # a product new to the Best Sellers list counts as a +50% rank gain
  reddit_min_mentions: 2       # fewer buy-intent posts than this in 28 days = no Reddit signal
  tiktok_weights:              # blend for the "TikTok momentum" number
    tiktokshop: 1.0            # TikTok Shop revenue for the keyword
    shopvideos: 0.5            # views of shoppable videos for the keyword
    tiktok: 0.5                # hashtag total views
  outside_weights:             # blend for the "demand outside TikTok" number
    google: 1.0
    amazon: 1.0
    reddit: 1.0
  demand_weights:              # blend for the lead-lag gap (TikTok counts most)
    tiktokshop: 1.0
    shopvideos: 0.5
    tiktok: 0.5
    google: 0.25
    amazon: 0.25
    reddit: 0.25
  saturation_reference:        # the level at which each signal counts as "fully crowded"
    sellers: 100               # distinct sellers among the top 100 TikTok Shop products
    creators: 100              # distinct creators among the top 100 shoppable videos
    revenue_7d: 1000000        # weekly TikTok Shop revenue of those products, USD
    hashtag_views: 10000000000 # TikTok hashtag total views (10 billion)
  saturation_weights:          # how much each signal counts toward tiktok_saturation
    sellers: 0.30
    creators: 0.25
    revenue: 0.20
    top3_share: 0.10
    hashtag_views: 0.15

# --- Opportunity score (scoring step) ---
# TikTok leads, everything else confirms:
# opportunity = (TikTok demand + outside demand) x confirmation bonus
#               x TikTok headroom x steadiness x margin x 100
scoring:
  tiktok_weights:              # TikTok growth: the core of the score
    tiktokshop: 1.0            # TikTok Shop revenue for the keyword
    shopvideos: 0.5            # shoppable-video views
    tiktok: 0.5                # hashtag views
  confirmation_weights:        # outside growth adds a little on its own...
    google: 0.25
    amazon: 0.25
    reddit: 0.25               # set to 1.0 to treat Reddit like TikTok (early-riser signal)
  confirmation_bonus: 0.15     # ...and each rising outside source multiplies the score by +15%
  velocity_cap: 2.0
  saturation_strength: 4       # saturation 1.0 cuts the score to 1/5; 0.5 cuts it to 1/3
  unknown_saturation: 0.5      # assumed when there's no TikTok Shop data yet
  unknown_sustained: 0.75      # assumed when there's no history yet
  spike_penalty: 0.5           # multiply by this when the rise looks like a one-off spike

# --- Keyword watchlist ---
# Products you want tracked no matter what. Google Trends, TikTok and the
# Kalodata keyword search look these up first, then the product concepts
# the system finds on its own (shortlisted first).
watchlist: []

# --- Amazon Best Sellers (via Apify) ---
# One actor run per category; each returns the top 50 products.
# Cost per category per run: ~$0.10 on Apify's free plan, ~$0.02 on Starter.
# All 24 categories weekly: ~$10/month on free, ~$2/month on Starter.
amazon:
  top_100: false                     # true = ranks 51-100 too (doubles the cost)
  max_charge_per_category_usd: 0.12  # hard limit Apify enforces per run
  # Physical-product categories only (books, apps, music, gift cards etc. left out).
  # Names are Amazon's URL slugs: amazon.com/gp/bestsellers/<slug>
  categories:
    - appliances            # Appliances
    - arts-crafts           # Arts, Crafts & Sewing
    - automotive            # Automotive
    - baby-products         # Baby
    - beauty                # Beauty & Personal Care
    - photo                 # Camera & Photo
    - wireless              # Cell Phones & Accessories
    - fashion               # Clothing, Shoes & Jewelry
    - pc                    # Computers & Accessories
    - electronics           # Electronics
    - grocery               # Grocery & Gourmet Food
    - handmade              # Handmade
    - hpc                   # Health & Household
    - home-garden           # Home & Kitchen
    - industrial            # Industrial & Scientific
    - kitchen               # Kitchen & Dining
    - musical-instruments   # Musical Instruments
    - office-products       # Office Products
    - lawn-garden           # Patio, Lawn & Garden
    - pet-supplies          # Pet Supplies
    - sporting-goods        # Sports & Outdoors
    - hi                    # Tools & Home Improvement
    - toys-and-games        # Toys & Games
    - boost                 # Unique Finds

# --- Kalodata (TikTok Shop data) ---
# Each page of 100 rows costs 0.1 credits. Queries cover the last 7 days,
# so a weekly run captures every week with no gaps or overlap.
# Current plan: 10 pages per weekly run = 1.0 credits/week (~4.3/month).
kalodata:
  region: US
  per_run_credit_cap: 2.0     # stop if a run's planned queries would cost more
  min_balance_reserve: 2.0    # never spend the balance below this
  usd_per_credit: 0           # set this once we know what a credit costs, for cost tracking
  # TikTok-first discovery: products in the EARLY phase on TikTok Shop, not
  # the ones already on top. 14 pages = 1.4 credits per weekly run.
  queries:
    # Small products (weekly revenue $1k-$50k) growing fastest vs the week before:
    # the early risers most people haven't noticed yet.
    - key: rising_small_7d
      endpoint: tiktok/product/rank
      pages: 5
      body:
        date_range: last7Day
        sort_field: {field: revenue_growth_rate, type: DESC}
        revenue_range: "1000-50000"
        need_extra: true
    # Mid-size products ($50k-$500k a week) still growing fast.
    - key: rising_mid_7d
      endpoint: tiktok/product/rank
      pages: 2
      body:
        date_range: last7Day
        sort_field: {field: revenue_growth_rate, type: DESC}
        revenue_range: "50000-500000"
        need_extra: true
    # Products launched in the last 7 days, best sellers first.
    - key: new_launches_7d
      endpoint: tiktok/product/rank
      pages: 3
      body:
        date_range: last7Day
        launch_date: "<7"
        sort_field: {field: revenue, type: DESC}
        need_extra: true
    # Most-viewed shoppable videos this week (that actually sell something).
    # Viral videos usually come before a product's sales spike.
    - key: viral_shop_videos_7d
      endpoint: tiktok/video/rank
      pages: 3
      body:
        date_range: last7Day
        sort_field: {field: views, type: DESC}
        revenue_range: ">100"
    # Mid-level categories: growth, and how concentrated sales are in the top 3 shops.
    - key: categories_l2_7d
      endpoint: tiktok/category/rank
      pages: 1
      body:
        date_range: last7Day
        category_level: 2
        revenue_range: ">50000"   # skip tiny categories with meaningless % jumps
        sort_field: {field: revenue_growth_rate, type: DESC}

# Retry settings for every API call.
retries:
  attempts: 4          # total tries before giving up on a request
  base_delay_seconds: 2  # wait 2s, then 4s, then 8s... between tries

# Spending cap per collector per day, in US dollars. A collector stops
# fetching once the next request would go over its cap (it keeps what it got).
cost_caps:
  apify_per_day_usd: 15.00

# Logging
logging:
  level: INFO          # INFO for normal use, DEBUG for troubleshooting

# --- Which concepts get looked up (see collectors/keywords.py) ---
# Only TikTok-fit concepts are ever looked up. TikTok checks come first;
# Google Trends only confirms the top TikTok candidates.
enrichment:
  google_recheck_weeks: 4     # re-check a candidate on Google at most every 4 weeks

# --- Kalodata keyword search (TikTok Shop momentum + saturation per keyword) ---
# 0.2 credits per keyword (one product search + one video search).
# Looks up as many keywords as the balance allows (above min_balance_reserve),
# most important first, and logs how many were skipped.
kalodata_keywords:
  max_keywords: 100           # per weekly run = up to 20 credits
  per_run_credit_cap: 25

# --- Google Trends (via Apify) --- confirmation only
# ~$0.026 per keyword. 60 keywords weekly = ~$1.60/week.
google_trends:
  max_keywords: 60            # top TikTok candidates + watchlist + shortlisted
  rising_searches_as_items: false   # true = turn "rising related searches" into items for Claude to group
                                    # (off: mostly variants of existing concepts, and costly to group)
  batch_size: 25
  geo: US
  time_range: today 12-m      # 12 months of weekly data points

# --- TikTok hashtags (via Apify) ---
# Cost per hashtag = videos_per_hashtag x ~$0.002-0.003. The hashtag's total
# views (the key number) comes with every video, so 3 videos is enough.
# 100 hashtags x 3 videos weekly = ~$0.60/week.
tiktok:
  max_keywords: 100           # same priority order as the Kalodata keyword search
  batch_size: 25
  videos_per_hashtag: 3

# --- Reddit (official API, free) ---
# Posts matching any buy-intent phrase in these subreddits.
reddit:
  time_filter: day            # "day" for daily runs, "week" if run weekly
  max_posts_per_subreddit: 100
  subreddits:
    - BuyItForLife
    - shutupandtakemymoney
    - INEEEEDIT
    - ofcoursethatsathing
    - gadgets
    - SkincareAddiction
    - MakeupAddiction
    - BeautyGuruChatter
    - HaircareScience
    - CleaningTips
    - organization
    - HomeImprovement
    - HomeDecorating
    - Parenting
    - BabyBumps
    - dogs
    - cats
    - fitness
    - Cooking
    - camping
    - femalefashionadvice
    - malefashionadvice
  buy_intent_phrases:
    - game changer
    - holy grail
    - worth every penny
    - best purchase
    - where can I buy
    - where did you get
    - just bought
    - obsessed with
    - life changing
    - can't live without
